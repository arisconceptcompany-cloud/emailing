# Aris emailing — configuration Nginx (SPA Vite + en-têtes de sécurité)
# Servie derrière un reverse proxy TLS (Caddy, Traefik ou Nginx hôte).

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    charset utf-8;

    # ---------- Compression ----------
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml
        font/woff2;

    # ---------- En-têtes de sécurité ----------
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    # CSP adaptée à l'app (Google Fonts + styles inline Tailwind/Recharts).
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'; object-src 'none'; img-src 'self' data: blob:; font-src 'self' https://fonts.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; script-src 'self'; connect-src 'self' https://fonts.googleapis.com https://fonts.gstatic.com" always;

    # ---------- API (FastAPI) ----------
    # Le frontend appelle /api/* en même origine ; Nginx relaie vers le conteneur « api ».
    location /api/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $api_upstream http://api:8000;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # ---------- Assets immuables (hash Vite) ----------
    location /assets/ {
        expires 1y;
        access_log off;
        try_files $uri =404;
    }

    location = /favicon.svg {
        expires 7d;
        access_log off;
        try_files $uri =404;
    }

    # index.html jamais mis en cache (déploiements immédiats)
    location = /index.html {
        expires -1;
    }

    # ---------- Routage SPA ----------
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Fichiers cachés interdits
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
